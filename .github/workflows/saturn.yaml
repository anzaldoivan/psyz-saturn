# Additive fork job: link the Saturn backend title in the pinned yaul image.
name: Saturn
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: saturn-${{ github.ref }}
  cancel-in-progress: true
jobs:
  saturn:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ijacquez/yaul@sha256:b6d272204767cd0a734139dd3a2ab298ef5912fb7b7224b78e6d9fac1a7825a6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fork
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yaul-org/libyaul
          ref: 6012f79f237773378c8014e70d8998ad95a38d98
          path: libyaul
          persist-credentials: false
      - name: Build libyaul and link the title
        run: sh fork/tools/ci/saturn/link.sh libyaul
