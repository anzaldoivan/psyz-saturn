# Additive fork governance; existing upstream workflows remain unchanged.
name: Upstream workflow parity
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tools/ci/check_upstream_workflows.py'
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workflow-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify local hash implementation
        run: python3 tools/ci/check_upstream_workflows.py --self-test
      - name: Compare all upstream workflows against fork
        run: python3 tools/ci/check_upstream_workflows.py
